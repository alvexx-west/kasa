<style>

.card{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.06));backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 24px rgba(0,0,0,.22);border-radius:18px;padding:14px;margin:10px 0}

.tx{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.ic{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:19px}
.tx div.f{flex:1;min-width:0}.tx .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--g)}
input,textarea{width:100%;font:inherit;color:var(--t);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:11px;margin:5px 0 10px}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.s{display:flex}#ov2{z-index:30;align-items:center}
.sheet{width:100%;max-width:560px;background:linear-gradient(135deg,rgba(60,78,100,.6),rgba(25,34,46,.55));backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-radius:22px 22px 0 0;padding:16px;max-height:92vh;overflow:auto;border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
#ov2 .sheet{border-radius:22px;width:90%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{padding:14px 4px}
.seg{display:flex;gap:8px}.seg button{flex:1}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#065f46;padding:10px 16px;border-radius:12px;z-index:50;opacity:0;transition:.3s;pointer-events:none}
#toast.s{opacity:1}#toast.e{background:#991b1b}
section{display:none;animation:f .25s}section.s{display:block}@keyframes f{from{opacity:0;transform:translateY(6px)}}
svg{width:100%;height:auto}svg text{fill:#e2e8f0;font-size:9px}
.lgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.lg{position:relative;height:200px;overflow:hidden;border-radius:24px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tg{--a:#4ade80;--b:#047857}.tr{--a:#fb7185;--b:#9f1239}.ta{--a:#fbbf24;--b:#b45309}
.lq{position:absolute;left:0;right:0;bottom:0;transition:height 1.2s}
.lb{position:absolute;inset:0;background:linear-gradient(var(--a),var(--b));opacity:.9}
.wave{position:absolute;bottom:calc(100% - 1px);left:0;width:200%;height:20px;fill:var(--a);animation:wf 7s linear infinite}
.wave.back{opacity:.45;height:24px;animation-duration:11s;animation-direction:reverse}
@keyframes wf{to{transform:translateX(-50%)}}
.lt{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:10px;text-shadow:0 1px 6px #000a}
.lp{font-size:22px;font-weight:700}.lv{font-size:11px;font-weight:600}
@media(prefers-reduced-motion:reduce){.wave{animation:none}}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:400px;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:26px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.07));backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 28px rgba(0,0,0,.4)}
.ni{flex:1;border:0;background:none;border-radius:0;padding:4px 0;color:#cbd5e1;font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
.ni svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ni.on{color:var(--g);font-weight:700}
.plus{flex:none;width:56px;height:40px;margin:0 4px;border-radius:20px;border:1px solid rgba(255,255,255,.45);padding:0;background:linear-gradient(135deg,#86efac,#4ade80 60%,#22c55e);box-shadow:0 4px 14px rgba(74,222,128,.4);display:grid;place-items:center}
.plus svg{width:20px;height:20px;stroke:#04251b;stroke-width:2.5;stroke-linecap:round;fill:none}

<nav class="dock" aria-label="Navigasi utama"><button class="ni" onclick="go(0)"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg>Ringkasan</button><button class="ni" onclick="go(1)"><svg viewBox="0 0 24 24"><rect x="4.5" y="3.5" width="15" height="17" rx="3"/><path d="M8.5 9h7M8.5 13h4.5"/></svg>Transaksi</button><button class="plus" onclick="openF()" aria-label="Catat transaksi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button class="ni" onclick="go(2)"><svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12z"/><path d="M15 3.9a8.5 8.5 0 0 1 5.1 5.1H15z"/></svg>Analisis</button><button class="ni" onclick="go(3)"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-9"/></svg>Grafik</button></nav>
<div class="ov" id="ov" onclick="if(event.target==this)cl()"><div class="sheet" id="sh"></div></div>
<div class="ov" id="ov2" onclick="if(event.target==this)cl2()"><div class="sheet" id="sh2"></div></div>
<div id="toast"></div>
<input type="file" id="fi" accept=".json,application/json" style="display:none" onchange="imp(this)">
<script>
var K='kasa_v1',$=function(s){return document.querySelector(s)};
var CAT={out:{Makanan:'🍜',Transportasi:'🚌',Belanja:'🛍️',Tagihan:'🧾',Investasi:'📈',Game:'🎮',Lainnya:'📦'},in:{Gaji:'💼',Reward:'🎁',Investasi:'📈',Lainnya:'💰'}};
var MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var ST={ls:0,idb:0};
function pj(j){try{var d=JSON.parse(j);if(d&&Array.isArray(d.tx))return{tx:d.tx,target:+d.target||0,ts:+d.ts||0}}catch(e){}return null}
function ld(){var j=null;try{j=localStorage.getItem(K);localStorage.setItem(K+'_t','1');localStorage.removeItem(K+'_t');ST.ls=1}catch(e){}return pj(j)||{tx:[],target:0,ts:0}}
function idb(cb){try{var r=indexedDB.open('kasa',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){cb(r.result)};r.onerror=r.onblocked=function(){cb(null)}}catch(e){cb(null)}}
function idbPut(j){idb(function(db){if(!db)return;try{var t=db.transaction('kv','readwrite');t.objectStore('kv').put(j,K);t.oncomplete=function(){ST.idb=1;db.close()};t.onerror=function(){db.close()}}catch(e){}})}
function idbGet(cb){idb(function(db){if(!db)return cb(null);try{var q=db.transaction('kv','readonly').objectStore('kv').get(K);q.onsuccess=function(){ST.idb=1;db.close();cb(q.result||null)};q.onerror=function(){db.close();cb(null)}}catch(e){cb(null)}})}
function warn(){return(!ST.ls&&!ST.idb)?'<div class="card warn">⚠ Penyimpanan browser tidak aktif, data akan hilang saat web ditutup. Buka lewat Chrome/Safari (bukan pratinjau/aplikasi chat) dan rutin pakai Backup JSON.</div>':''}
var S=ld(),pg=0,per=6,F={};
function sv(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){toast('Gagal menyimpan: '+e.message,1);return false}}
function pad(n){return n<10?'0'+n:''+n}
function tds(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var cm=tds().slice(0,7);
function rp(n){return(n<0?'-':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID')}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mlabel(m){return MN[+m.slice(5)-1]+' '+m.slice(0,4)}
function madd(m,k){var y=+m.slice(0,4),n=+m.slice(5)-1+k;y+=Math.floor(n/12);n=((n%12)+12)%12;return y+'-'+pad(n+1)}
function mt(m){var i=0,o=0;S.tx.forEach(function(t){if(t.date.slice(0,7)==m){t.type=='in'?i+=t.amt:o+=t.amt}});return{i:i,o:o,n:i-o}}
function pct(a,b){return b?((a-b)/b*100):(a?100:0)}
function pc(v,goodDown){var c=(v>0)!=!!goodDown?'g':'r';return'<span class="'+c+'">'+(v>0?'▲ ':v<0?'▼ ':'')+Math.abs(v).toFixed(0)+'%</span>'}
function toast(t,e){var x=$('#toast');x.textContent=t;x.className='s'+(e?' e':'');clearTimeout(x.h);x.h=setTimeout(function(){x.className=''},2600)}
function go(i){pg=i;rd()}
function srt(a){return a.slice().sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:(x.id<y.id?-1:1)})}
function item(t){var ic=(CAT[t.type]||{})[t.cat]||'📦';return'<div class="tx" onclick="openF(\''+t.id+'\')"><div class="ic">'+ic+'</div><div class="f"><div>'+esc(t.cat)+'</div><div class="m">'+t.date+(t.note?' · '+esc(t.note):'')+'</div></div><b class="'+(t.type=='in'?'g':'r')+'">'+(t.type=='in'?'+':'-')+rp(t.amt)+'</b></div>'}
function msel(){return'<div class="row card"><button onclick="cm=madd(cm,-1);rd()">‹</button><b>'+mlabel(cm)+'</b><button onclick="cm=madd(cm,1);rd()">›</button></div>'}
function rd(){
document.querySelectorAll('section').forEach(function(s,i){s.className=i==pg?'s':''});
document.querySelectorAll('.ni').forEach(function(b,i){b.className='ni'+(i==pg?' on':'')});
var tot=0;S.tx.forEach(function(t){tot+=t.type=='in'?t.amt:-t.amt});
var now=tds().slice(0,7),m=mt(now),pv=mt(madd(now,-1));
var ach=Math.max(0,m.n),tp=S.target?Math.min(100,ach/S.target*100):0;
var r=srt(S.tx).reverse();
$('#p0').innerHTML=warn()+'<div class="card saldo"><h2>Saldo bersih</h2><div class="big '+(tot>=0?'g':'r')+'">'+rp(tot)+'</div></div>'+
'<div class="row"><div class="card" style="flex:1"><h2>Pemasukan '+MN[+now.slice(5)-1]+'</h2><b class="g">'+rp(m.i)+'</b></div><div class="card" style="flex:1"><h2>Pengeluaran</h2><b class="r">'+rp(m.o)+'</b></div></div>'+
'<div class="card"><h2>Selisih bulan ini</h2><b class="'+(m.n>=0?'g':'r')+'">'+rp(m.n)+'</b><div class="m">Pengeluaran vs bulan lalu: '+pc(pct(m.o,pv.o),1)+'</div></div>'+
'<div class="card"><h2>Target tabungan</h2>'+(S.target?'<div class="row"><b>'+rp(ach)+'</b><span class="m">dari '+rp(S.target)+'</span></div><div class="bar"><i style="width:'+tp+'%"></i></div><div class="m">'+tp.toFixed(0)+'% · sisa '+rp(Math.max(0,S.target-ach))+'</div>':'<div class="m">Belum diatur. Atur di tab Analisis.</div>')+'</div>'+
'<div class="card"><h2>Terbaru</h2>'+(r.slice(0,5).map(item).join('')||'<div class="m">Belum ada transaksi. Tekan +</div>')+'</div>';
$('#p1').innerHTML='<div class="card"><h2>Riwayat ('+r.length+')</h2>'+(r.map(item).join('')||'<div class="m">Belum ada transaksi.</div>')+'</div>';
var a=mt(cm),p=mt(madd(cm,-1)),cats={};
S.tx.forEach(function(t){if(t.type=='out'&&t.date.slice(0,7)==cm)cats[t.cat]=(cats[t.cat]||0)+t.amt});
var ck=Object.keys(cats).sort(function(x,y){return cats[y]-cats[x]});
var ca=Math.max(0,a.n),tp2=S.target?Math.min(100,ca/S.target*100):0;
$('#p2').innerHTML=msel()+'<div class="card"><div class="row"><span>Pemasukan</span><b class="g">'+rp(a.i)+'</b></div><div class="row"><span>Pengeluaran</span><b class="r">'+rp(a.o)+'</b></div><div class="row"><span>Saldo bersih</span><b class="'+(a.n>=0?'g':'r')+'">'+rp(a.n)+'</b></div></div>'+
'<div class="card"><h2>Pengeluaran per kategori</h2>'+(ck.map(function(k){return'<div style="margin-bottom:8px"><div class="row"><span>'+(CAT.out[k]||'📦')+' '+esc(k)+'</span><b>'+rp(cats[k])+' · '+(a.o?cats[k]/a.o*100:0).toFixed(0)+'%</b></div><div class="bar"><i style="width:'+(cats[k]/a.o*100)+'%"></i></div></div>'}).join('')||'<div class="m">Tidak ada pengeluaran.</div>')+'</div>'+
'<div class="card"><h2>Dibanding '+mlabel(madd(cm,-1))+'</h2><div class="row"><span>Pemasukan</span>'+pc(pct(a.i,p.i))+'</div><div class="row"><span>Pengeluaran</span>'+pc(pct(a.o,p.o),1)+'</div><div class="row"><span>Saldo bersih</span>'+pc(pct(a.n,Math.abs(p.n))*(1))+'</div></div>'+
advice(cm)+'<div class="card"><h2>Target tabungan bulanan</h2>'+(S.target?'<div class="row"><span>Tercapai '+rp(ca)+'</span><span class="m">Target '+rp(S.target)+'</span></div><div class="bar"><i style="width:'+tp2+'%"></i></div><div class="m">'+tp2.toFixed(0)+'% · sisa '+rp(Math.max(0,S.target-ca))+'</div>':'')+
'<input id="tgt" inputmode="numeric" placeholder="Nominal target (Rp)" value="'+(S.target||'')+'"><button class="p" onclick="stg()">Simpan target</button></div>'+
'<div class="card"><h2>Laporan &amp; cadangan</h2><div class="seg" style="flex-wrap:wrap"><button onclick="csv()">⬇ CSV '+mlabel(cm)+'</button><button onclick="exp()">⬇ Backup JSON</button><button onclick="$(\'#fi\').click()">⬆ Impor</button></div><div class="m" style="margin-top:8px">Penyimpanan: '+(ST.ls||ST.idb?'✓ aktif ('+(ST.ls&&ST.idb?'ganda':ST.ls?'lokal':'IndexedDB')+')':'⚠ tidak aktif')+'</div></div>';
chartsRd()}
function ct(m){var c={};S.tx.forEach(function(t){if(t.type=='out'&&t.date.slice(0,7)==m)c[t.cat]=(c[t.cat]||0)+t.amt});return c}
var FIX={Tagihan:1,Investasi:1},WT={Game:[1,.5],Belanja:[.8,.35],Lainnya:[.7,.3],Makanan:[.35,.15],Transportasi:[.3,.15]};
function advice(m){
var a=mt(m),c=ct(m),nx=mlabel(madd(m,1)),h='<div class="card"><h2>Analisis &amp; saran untuk '+nx+'</h2>';
if(!a.i&&!a.o)return h+'<div class="m">Belum ada data di '+mlabel(m)+'.</div></div>';
